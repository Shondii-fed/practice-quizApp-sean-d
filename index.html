<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer type="module"></script>
    <style>
        button {
            display: flex;
            flex-direction: column;
            margin: 0.2em;
            padding: 0.5em;
        }
    </style>
    <title>Quiz App</title>
</head>
<body>
    <header>
        <h1>Welcome to the Quiz App!</h1>
    </header>
    <main>
        <p id="question"></p>
        <button id="option-a"></button>
        <button id="option-b"></button>
        <button id="option-c"></button>
        <button id="option-d"></button>
        <p id="feedback"></p>
        <button id="next-question">Start Quiz</button>
    </main>
    <footer>
        <p>&copy;2026 This was created by Sean Diggs for Launchcode.</p>
    </footer>
</body>
</html>
